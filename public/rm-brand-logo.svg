<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <!-- RM Bike Point - Full Horizontal Brand Logo -->
  <!-- Used in: Navbar, Footer, Drawer -->
  
  <!-- RM Monogram (italic, skewed, racing style) -->
  <g transform="translate(8, 8) skewX(-12)" stroke-linejoin="round">
    <!-- R letterform -->
    <path d="M 0,0 L 80,0 C 108,0 108,42 80,42 L 54,42 L 80,76 L 54,76 L 32,42 L 22,42 L 16,76 L -10,76 Z" 
          fill="#F5F5F5" />
    <!-- M letterform -->
    <path d="M 92,76 L 112,0 L 140,32 L 168,0 L 152,76 L 130,76 L 140,32 L 120,76 Z" 
          fill="#F5F5F5" />
    <!-- Red accent chevron -->
    <path d="M 162,76 L 178,44 L 194,44 L 178,76 Z" fill="#FF3B30" />
  </g>
  
  <!-- Divider line -->
  <line x1="210" y1="20" x2="210" y2="96" stroke="#333333" stroke-width="1.5" />
  
  <!-- BIKE POINT text -->
  <text x="226" y="52" 
        font-family="'Arial Black', 'Arial Bold', sans-serif" 
        font-size="22" 
        font-weight="900" 
        fill="#F5F5F5" 
        letter-spacing="4">BIKE</text>
  <text x="226" y="78" 
        font-family="'Arial Black', 'Arial Bold', sans-serif" 
        font-size="22" 
        font-weight="900" 
        fill="#FF3B30" 
        letter-spacing="4">POINT</text>
</svg>
