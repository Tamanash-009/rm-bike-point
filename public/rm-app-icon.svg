<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- RM Bike Point - Square App Icon -->
  <!-- Used in: PWA icon, Favicon, Android/iOS home screen -->
  
  <!-- Matte black background -->
  <rect width="512" height="512" fill="#0D0D0D"/>
  
  <!-- RM Monogram centered with 20% safe padding (safe area: 102px–410px) -->
  <g transform="translate(256, 248)" stroke-linejoin="round">
    <!-- Skewed racing letterforms, centered -->
    <g transform="translate(-138, -88) skewX(-12)">
      <!-- R letterform -->
      <path d="M 0,0 L 130,0 C 175,0 175,70 130,70 L 88,70 L 130,130 L 88,130 L 52,70 L 34,70 L 26,130 L -16,130 Z" 
            fill="#F5F5F5" />
      <!-- M letterform -->
      <path d="M 150,130 L 178,0 L 228,54 L 278,0 L 252,130 L 214,130 L 228,54 L 196,130 Z" 
            fill="#F5F5F5" />
      <!-- Red speed-mark accent -->
      <path d="M 268,130 L 296,68 L 322,68 L 294,130 Z" fill="#FF3B30" />
    </g>
  </g>
  
  <!-- Red accent underline -->
  <rect x="154" y="356" width="204" height="6" fill="#FF3B30" rx="3"/>
  <rect x="184" y="368" width="144" height="4" fill="#FF3B30" rx="2" opacity="0.4"/>
</svg>
